  .stat{font-size:12px;color:var(--muted);margin-left:auto}
  .searchbox{position:relative;margin-bottom:8px}
  #q{
    width:100%;padding:13px 15px;font-size:15px;border:2px solid var(--line);
    border-radius:14px;outline:none;background:#fff;transition:.15s;

  #q:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(37,99,235,.10)}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:8px 14px;border:1px solid var(--line);border-radius:999px;
    background:#fff;color:#374151;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;
  }
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .chip.sm{padding:6px 12px;font-size:12px}
  button.primary{
    width:100%;padding:13px;border:0;border-radius:14px;background:var(--brand);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin:6px 0 16px;font-family:inherit;
  }
  button.ghost{
    width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;
    background:#fff;color:#374151;font-size:14px;cursor:pointer;font-family:inherit;

  .card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}

  .item.old{opacity:.8}

  .tag{font-size:11px;padding:3px 8px;border-radius:8px;color:#fff}

  .tag.found{background:var(--found)}
  .tag.ok{background:#9ca3af}
  .tag.old{background:#f59e0b}
  .cat{font-size:11px;padding:3px 8px;border-radius:8px;background:#eef2ff;color:#4338ca}
  .item h3{margin:2px 0 6px;font-size:16px;line-height:1.4;word-break:break-word}
  .item .desc{margin:0 0 8px;font-size:13px;color:#4b5563;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .item img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin:4px 0 10px;display:block;background:#f3f4f6}
  .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:10px}
  .acts{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
  .acts .time{font-size:11px;color:#9ca3af;margin-right:auto}
  .acts button{
    padding:7px 14px;font-size:12px;border:1px solid var(--line);border-radius:9px;
    background:#fff;color:#374151;cursor:pointer;font-family:inherit;
  }
  .acts button.main{background:var(--brand);border-color:var(--brand);color:#fff}
  .acts button.danger{color:var(--lost);border-color:#fecaca;background:#fef2f2}

  .form .field{margin-bottom:12px}
  .form label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}

  .form input:focus,.form select:focus,.form textarea:focus{border-color:var(--brand)}

  .row>*{flex:1;min-width:0}
  .row .field{margin-bottom:12px}
  .hide{display:none !important}
  .toast{

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function hl(s) {
  let out = esc(s);
  curTokens.forEach((t) => {
    const e = esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (!e) return;
    out = out.replace(new RegExp(e, 'gi'), (m) => '<mark>' + m + '</mark>');
  });
  return out;
}
function timeAgo(ts) {
  const d = Date.now() - (ts || 0);
  const m = Math.floor(d / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  const day = Math.floor(h / 24);
  if (day < 30) return day + ' 天前';
  return new Date(ts).toLocaleDateString('zh-CN');

function uid() {

function compress(file, max = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob((b) => b ? resolve(b) : reject(new Error('图片处理失败')), 'image/jpeg', quality);
    };
    img.onerror = () => reject(new Error('这张图片读不出来，换一张试试'));
    img.src = url;
  });
}

  btn.textContent = '登录中…';
  try {
    const { error } = await db.auth.signInWithPassword({
      email: account + ACCOUNT_DOMAIN,
      password
    });
    if (error) {
      throw new Error(/invalid|credential/i.test(error.message) ? '账号或密码不对' : error.message);
    }
    f.reset();
  } catch (err) {
    toast(err.message || '登录失败');
  } finally {
    btn.disabled = false;
    btn.textContent = '登录';
  }
});

$('#regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const btn = f.querySelector('button[type=submit]');
  const account = f.account.value.trim().toLowerCase();
  const password = f.password.value;
  const nickname = f.nickname.value.trim() || randomNick();

  if (!/^[a-z0-9_]{3,20}$/.test(account)) return toast('账号只能用 3-20 位字母、数字、下划线');
  if (password.length < 6) return toast('密码至少 6 位');

  btn.disabled = true;
  btn.textContent = '注册中…';
  try {
    const { data, error } = await db.auth.signUp({
      email: account + ACCOUNT_DOMAIN,
      password,
      options: { data: { nickname, account } }
    });

    if (error) {
      if (/already|registered|exists/i.test(error.message)) {
        throw new Error('这个账号已经被注册了，换一个吧');
      }
      throw new Error(error.message);
    }
    if (data.user && (!data.user.identities || data.user.identities.length === 0) && !data.session) {
      throw new Error('这个账号已经被注册了，换一个吧');
    }
    if (!data.session) {
      throw new Error('注册成功但需要邮箱验证。请先在 Supabase 关闭 Confirm email 再来试。');
    }
    toast('注册成功，欢迎你 🎉');
    f.reset();
  } catch (err) {
    toast(err.message || '注册失败');
  } finally {
    btn.disabled = false;
    btn.textContent = '注册并登录';
  }
});

$('#logoutBtn').addEventListener('click', async () => {
  clearAdmin();                    // 退出时清掉管理员状态
  await db.auth.signOut();
  toast('已退出登录');
});

(async function boot() {
  try {
    const { data } = await db.auth.getSession();
    if (data.session) enterApp(data.session.user);
  } catch (e) { /* 忽略 */ }

  db.auth.onAuthStateChange((evt, session) => {
    if (!session) { currentUser = null; clearAdmin(); showAuth(); return; }
    enterApp(session.user);
  });
})();

function renderCats() {
  const all = ['全部分类', ...CATEGORIES];
  $('#catChips').innerHTML = all.map((c) => {
    const val = c === '全部分类' ? '' : c;
    return '<button class="chip sm ' + (catFilter === val ? 'on' : '') +
           '" data-cat="' + esc(val) + '">' + esc(c) + '</button>';
  }).join('');
}

function cardHtml(it) {
  const mine = it.isMine;
  const done = it.status === 'done';
  const old = !done && (Date.now() - it.createdAt) > OLD_DAYS * 86400000;
  const tag = it.type === 'found'
    ? '<span class="tag found">拾获</span>'
    : '<span class="tag lost">丢失</span>';

  let btns = '';
  if (mine) {
    btns = '<button data-act="' + (done ? 'open' : 'done') + '" data-id="' + it.id + '">'
             + (done ? '重新开启' : '✓ 已处理完') + '</button>'
         + '<button class="danger" data-act="del" data-id="' + it.id + '">删除</button>';
  } else {
    btns = '<button class="main" data-act="claim" data-id="' + it.id + '">'
             + (it.needsAnswer ? '我要认领' : '看联系方式') + '</button>'
         + '<button class="tiny" data-act="report" data-id="' + it.id + '">举报</button>';
  }
  if (adminAuth) {
    btns += '<button class="danger" data-act="adm_del" data-id="' + it.id + '">管理员删除</button>';
  }

  return '<article class="card item ' + (done ? 'done' : '') + (old ? ' old' : '') + '">'
    + '<div class="top">' + tag
    + '<span class="cat">' + esc(it.category) + '</span>'
    + (done ? '<span class="tag ok">已完成</span>' : '')
    + (old ? '<span class="tag old">超过 ' + OLD_DAYS + ' 天</span>' : '')
    + '</div>'
    + '<h3>' + hl(it.title) + '</h3>'
    + (it.image ? '<img src="' + esc(it.image) + '" alt="物品照片" loading="lazy">' : '')
    + (it.desc ? '<p class="desc">' + hl(it.desc) + '</p>' : '')
    + '<div class="meta">'
    + '<span class="owner">👤 ' + esc(it.ownerName || '同学') + '</span>'
    + (it.place ? '<span>📍 ' + hl(it.place) + '</span>' : '')
    + (it.time ? '<span>🗓 ' + esc(it.time) + '</span>' : '')
    + '<span>🔒 联系方式需验证</span>'
    + '</div>'
    + '<div class="acts">'
    + '<span class="time">' + timeAgo(it.createdAt) + '</span>'
    + btns
    + '</div>'
    + '</article>';
}

function render() {
  const q = (qEl.value || '').trim().toLowerCase();
  curTokens = q ? q.split(/\s+/).filter(Boolean) : [];
  const guess = curTokens.length ? guessCategory(q) : '';
  hintEl.textContent = (curTokens.length && guess) ? '已自动识别分类：' + guess : '';

  const shown = items.filter((it) => {
    if (onlyMine && !it.isMine) return false;
    if (typeFilter && it.type !== typeFilter) return false;
    if (catFilter && it.category !== catFilter) return false;
    if (!curTokens.length) return true;
    const hay = [it.title, it.desc, it.place, it.category].join(' ').toLowerCase();
    if (curTokens.every((t) => hay.includes(t))) return true;
    return !!(guess && it.category === guess);
  });

  $('#stat').textContent = '待认领 ' + items.filter((x) => x.status === 'open').length + ' 条';
  $('#count').textContent = onlyMine
    ? '我的发布 ' + shown.length + ' 条'
    : (curTokens.length ? '找到 ' + shown.length + ' 条' : '共 ' + shown.length + ' 条信息');

  if (!shown.length) {
    listEl.innerHTML = '<div class="empty">'
      + (onlyMine ? '你还没有发布过信息'
        : items.length ? '没有匹配的信息，换个关键词试试 🙈'
        : '还没有人发布，点上面「发布信息」发第一条吧 👆')
      + '</div>';
    return;
  }
  listEl.innerHTML = shown.map(cardHtml).join('');
}

async function load() {
  if (!currentUser) return;
  try {
    const { data, error } = await db
      .from('items_public')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(300);
    if (error) throw error;

    items = (data || []).map((r) => ({
      id: r.id,
      ownerName: r.owner_name || '',
      title: r.title,
      type: r.type,
      category: r.category || '其他',
      place: r.place || '',
      time: r.happened_on || '',
      desc: r.description || '',
      image: r.image_url || '',
      claimQuestion: r.claim_question || '',
      needsAnswer: !!r.needs_answer,
      isMine: !!r.is_mine,
      reports: r.report_count || 0,
      status: r.status,
      createdAt: new Date(r.created_at).getTime()
    }));
    render();
  } catch (e) {
    listEl.innerHTML = '<div class="empty">加载失败：' + esc(e.message)
      + '<br><br>请检查数据库是否已建好</div>';
  }
}

qEl.addEventListener('input', render);

$('#typeChips').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-type]');
  if (btn) {
    typeFilter = btn.dataset.type;
    onlyMine = false;
    $('#mineBtn').classList.remove('on');
    [...$('#typeChips').children].forEach((x) => x.classList.toggle('on', x === btn));
    render();
    return;
  }
  if (e.target.id === 'mineBtn') {
    onlyMine = !onlyMine;
    typeFilter = '';
    $('#mineBtn').classList.toggle('on', onlyMine);
    [...$('#typeChips').children].forEach((x) => {
      if (x.dataset.type !== undefined) x.classList.toggle('on', false);
    });
    render();
  }
});

$('#catChips').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-cat]');
  if (!b) return;
  catFilter = b.dataset.cat;
  renderCats();
  render();
});

$('#catSel').innerHTML = CATEGORIES.map(
  (c) => '<option value="' + esc(c) + '">' + esc(c) + '</option>'
).join('');

$('#toggleForm').addEventListener('click', () => {
  form.classList.toggle('hide');
  if (!form.classList.contains('hide')) {
    form.querySelector('[name=title]').focus();
    const t = form.querySelector('[name=time]');
    if (!t.value) t.value = new Date().toISOString().slice(0, 10);
  }
});
$('#cancel').addEventListener('click', () => form.classList.add('hide'));

$('#typePick').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-t]');
  if (!b) return;
  pickType = b.dataset.t;
  [...$('#typePick').children].forEach((x) => x.classList.toggle('on', x === b));
  $('#claimFields').classList.toggle('hide', pickType !== 'found');
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!currentUser) return toast('请先登录');
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true;
  btn.textContent = '发布中…';
  try {
    checkRate();

    const title = form.querySelector('[name=title]').value.trim();
    if (!title) throw new Error('请填写物品名称');
    const contact = form.querySelector('[name=contact]').value.trim();
    if (!contact) throw new Error('请留下联系方式，不然别人找到也没法还你');

    let imageUrl = '';
    const file = form.querySelector('[name=image]').files[0];
    if (file) {
      if (file.size > 10 * 1024 * 1024) throw new Error('图片超过 10MB，请换一张');
      const blob = await compress(file);
      const path = uid() + '.jpg';
      const up = await db.storage.from('item-photos')
        .upload(path, blob, { contentType: 'image/jpeg', upsert: false });
      if (up.error) throw new Error('图片上传失败：' + up.error.message);
      imageUrl = db.storage.from('item-photos').getPublicUrl(path).data.publicUrl;
    }

    const isFound = pickType === 'found';
    const question = isFound ? form.querySelector('[name=q]').value.trim() : '';
    const answer = isFound ? form.querySelector('[name=a]').value.trim() : '';
    if (question && !answer) throw new Error('设了认领问题就要填正确答案');

    const { error } = await db.from('items').insert({
      id: uid(),
      owner_id: currentUser.id,
      owner_name: $('#nickName').textContent,
      title,
      type: pickType,
      category: form.querySelector('[name=category]').value,
      place: form.querySelector('[name=place]').value.trim(),
      happened_on: form.querySelector('[name=time]').value,
      description: form.querySelector('[name=desc]').value.trim(),
      contact,
      image_url: imageUrl,
      claim_question: question,
      claim_answer: answer
    });
    if (error) throw new Error(error.message.replace(/^.*?:\s*/, '') || '发布失败');

    markPosted();
    form.reset();
    form.classList.add('hide');
    $('#claimFields').classList.add('hide');
    pickType = 'lost';
    [...$('#typePick').children].forEach((x, i) => x.classList.toggle('on', i === 0));
    toast('发布成功 🎉');
    await load();
  } catch (err) {
    toast(err.message || '发布失败');
  } finally {
    btn.disabled = false;
    btn.textContent = '发布';
  }
});

listEl.addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  const act = b.dataset.act;

  if (act === 'claim') return openClaim(id);

  if (act === 'report') {
    if (!confirm('举报这条信息？如果是误报请别点。累计 3 人举报会自动下架。')) return;
    b.disabled = true;
    try {
      const { error } = await db.rpc('item_report', { p_id: id });
      if (error) throw error;
      toast('已举报，管理员会处理');
    } catch (err) {
      toast(err.message || '举报失败');
    } finally {
      b.disabled = false;
    }
    return;
  }

  if (act === 'adm_del') {
    if (!confirm('管理员操作：删除这条信息？')) return;
    b.disabled = true;
    try {
      const { data, error } = await db.rpc('admin_delete', {
        p_id: id,
        p_account: adminAuth.account,
        p_password: adminAuth.password
      });
      if (error) throw error;
      if (!data) throw new Error('管理员账号或密码不对，请重新登录');
      toast('已删除');
      await load();
    } catch (err) {
      toast(err.message || '删除失败');
    } finally {
      b.disabled = false;
    }
    return;
  }

  if (act === 'del' && !confirm('确定要删除这条信息吗？删了就找不回来了。')) return;

  b.disabled = true;
  try {
    if (act === 'done' || act === 'open') {
      const { data, error } = await db.rpc('item_set_status', {
        p_id: id, p_status: act === 'done' ? 'done' : 'open'
      });
      if (error) throw error;
      if (!data) throw new Error('只有发布者本人才能修改这条信息');
      toast(act === 'done' ? '已标记完成 ✅' : '已重新开启');
      await load();
    }
    if (act === 'del') {
      const { data, error } = await db.rpc('item_delete', { p_id: id });
      if (error) throw error;
      if (!data) throw new Error('只有发布者本人才能删除这条信息');
      toast('已删除');
      await load();
    }
  } catch (err) {
    toast(err.message || '操作失败');
  } finally {
    b.disabled = false;
  }
});

function openClaim(id) {
  const it = items.find((x) => x.id === id);
  if (!it) return;
  if (it.isMine) return toast('这是你自己发的');
  curClaimId = id;
  modalMode = 'claim';
  $('#mTitle').textContent = it.type === 'found' ? '认领这件物品' : '联系发布者';
  $('#mSub').textContent = it.needsAnswer
    ? '请回答发布者设的问题：\n' + it.claimQuestion
    : '提示：先确认好物品特征，避免误认。';
  const ans = $('#mAnswer');
  ans.value = '';
  ans.type = 'text';
  ans.placeholder = '请输入答案';
  ans.classList.toggle('hide', !it.needsAnswer);
  $('#mAnswer2').classList.add('hide');
  $('#mAnswer2').value = '';
  $('#mContact').innerHTML = '';
  $('#mOk').classList.remove('hide');
  $('#mOk').textContent = '确认';
  $('#modal').classList.remove('hide');
  if (it.needsAnswer) setTimeout(() => ans.focus(), 100);
}

function openAdmin() {
  if (adminAuth) {
    if (confirm('退出管理模式？')) {
      clearAdmin();
      toast('已退出管理模式');
      render();
    }
    return;
  }
  modalMode = 'admin';
  $('#mTitle').textContent = '管理员登录';
  $('#mSub').textContent = '输入管理员账号和密码';
  const a1 = $('#mAnswer');
  const a2 = $('#mAnswer2');
  a1.value = '';
  a1.type = 'text';
  a1.placeholder = '管理员账号';
  a1.classList.remove('hide');
  a2.value = '';
  a2.classList.remove('hide');
  $('#mContact').innerHTML = '';
  $('#mOk').classList.remove('hide');
  $('#mOk').textContent = '进入';
  $('#modal').classList.remove('hide');
  setTimeout(() => a1.focus(), 100);
}

$('#adminBtn').addEventListener('click', openAdmin);
$('#mCancel').addEventListener('click', () => $('#modal').classList.add('hide'));
$('#modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') $('#modal').classList.add('hide');
});

$('#mOk').addEventListener('click', async () => {
  const b = $('#mOk');

  if (modalMode === 'admin') {
    b.disabled = true;
    try {
      const account = $('#mAnswer').value.trim();
      const password = $('#mAnswer2').value;
      if (!account || !password) throw new Error('请填账号和密码');
      if (!currentUser) throw new Error('请先登录');
      const { data, error } = await db.rpc('admin_check', {
        p_account: account,
        p_password: password
      });
      if (error) throw error;
      if (!data) throw new Error('管理员账号或密码不对');

      // 绑定当前登录账号，换人自动失效
      adminAuth = { account, password, uid: currentUser.id };
      sessionStorage.setItem('admin_auth', JSON.stringify(adminAuth));
      document.body.classList.add('admin-on');
      $('#adminBtn').textContent = '管理员模式（点此退出）';
      $('#modal').classList.add('hide');
      toast('已进入管理模式');
      render();
    } catch (err) {
      toast(err.message || '验证失败');
    } finally {
      b.disabled = false;
    }
    return;
  }

  if (!curClaimId) return;
  b.disabled = true;
  b.textContent = '验证中…';
  try {
    const { data, error } = await db.rpc('item_claim', {
      p_id: curClaimId,
      p_answer: $('#mAnswer').value
    });
    if (error) throw error;
    if (!data || !data.ok) throw new Error((data && data.msg) || '验证没通过');

    $('#mAnswer').classList.add('hide');
    b.classList.add('hide');
    $('#mSub').textContent = '验证通过 ✅ 这是对方的联系方式';
    const c = String(data.contact || '');
    $('#mContact').innerHTML = '<div class="contact-num">' + esc(c || '对方没留联系方式') + '</div>'
      + (c ? '<button class="ghost" id="copyBtn" style="margin-bottom:12px">复制</button>' : '');
    if (c) {
      $('#copyBtn').addEventListener('click', () => {
        const done = () => toast('已复制');
        if (navigator.clipboard) navigator.clipboard.writeText(c).then(done, done);
        else done();
      });
    }
  } catch (err) {
    toast(err.message || '验证失败');
  } finally {
    b.disabled = false;
    b.textContent = '确认';
  }
});

/* ---------- 启动 ---------- */
if (adminAuth) {
  const u = (function () {
    return null;
  })();
}
renderCats();
render();
</script>
</body>
</html>
