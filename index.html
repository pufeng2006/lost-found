<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>校园服务</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--lost:#ef4444;--found:#10b981}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:manipulation}
  .wrap{max-width:680px;margin:0 auto;padding:16px 14px 70px}
  h1{font-size:20px;margin:4px 0 6px}
  .head{display:flex;align-items:center;gap:8px}
  .backbtn{background:none;border:0;color:var(--brand);font-size:13px;font-family:inherit;padding:0;cursor:pointer}
  .stat{font-size:12px;color:var(--muted);margin-left:auto}
  .stats-line{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.5}
  .searchbox{position:relative;margin-bottom:8px}
  #q{width:100%;padding:13px 15px;font-size:15px;border:2px solid var(--line);border-radius:14px;outline:none;background:#fff;transition:.15s}
  #q:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(37,99,235,.10)}
  .hint{display:block;margin:6px 2px 0;font-size:12px;color:var(--brand);min-height:16px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#374151;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .chip.sm{padding:6px 12px;font-size:12px}
  button.primary{width:100%;padding:13px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin:6px 0 16px;font-family:inherit}
  button.ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#374151;font-size:14px;cursor:pointer;font-family:inherit}
  .card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
  .item.done{opacity:.6}
  .item .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .tag{font-size:11px;padding:3px 8px;border-radius:8px;color:#fff}
  .tag.lost{background:var(--lost)}.tag.found{background:var(--found)}.tag.ok{background:#9ca3af}.tag.old{background:#f59e0b}.tag.market{background:#8b5cf6}
  .cat{font-size:11px;padding:3px 8px;border-radius:8px;background:#eef2ff;color:#4338ca}
  .price{color:var(--lost);font-weight:700;font-size:14px;margin-left:auto}
  .item h3{margin:2px 0 6px;font-size:16px;line-height:1.4;word-break:break-word}
  .item .desc{margin:0 0 8px;font-size:13px;color:#4b5563;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .item img{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin:4px 0 10px;display:block;background:#f3f4f6}
  .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:10px}
  .acts{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
  .acts .time{font-size:11px;color:#9ca3af;margin-right:auto}
  .acts button{padding:7px 14px;font-size:12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#374151;cursor:pointer;font-family:inherit}
  .acts button.main{background:var(--brand);border-color:var(--brand);color:#fff}
  .acts button.danger{color:var(--lost);border-color:#fecaca;background:#fef2f2}
  .acts button.tiny{padding:5px 9px;font-size:11px;color:#9ca3af;border-color:#f3f4f6}
  mark{background:#fef08a;color:inherit;padding:0 1px;border-radius:3px}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:50px 10px;line-height:1.7}
  .form .field{margin-bottom:12px}
  .form label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .form input,.form select,.form textarea{width:100%;padding:11px 12px;font-size:14px;border:1px solid var(--line);border-radius:11px;outline:none;background:#fff;font-family:inherit}
  .form textarea{resize:vertical;min-height:76px}
  .form input:focus,.form select:focus,.form textarea:focus{border-color:var(--brand)}
  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}
  .row .field{margin-bottom:12px}
  .hide{display:none !important}
  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:rgba(17,24,39,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .tip{text-align:center;font-size:12px;color:#9ca3af;margin-top:18px}
  .tip button{background:none;border:0;color:#9ca3af;text-decoration:underline;font-size:12px;cursor:pointer;font-family:inherit;margin:0 6px}
  .admin-on .tip button{color:var(--brand);font-weight:600}
  .modal{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
  .modal-box{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:400px;max-height:88vh;display:flex;flex-direction:column}
  .modal-box h4{margin:0 0 6px;font-size:16px}
  .mSub{margin:0 0 12px;font-size:13px;color:#4b5563;line-height:1.6;white-space:pre-wrap}
  .modal-box input{width:100%;padding:11px 12px;font-size:14px;border:1px solid var(--line);border-radius:11px;outline:none;margin-bottom:12px;font-family:inherit}
  .contact-num{font-size:17px;font-weight:600;text-align:center;padding:14px;background:#eff6ff;border-radius:12px;color:#1d4ed8;word-break:break-all;margin-bottom:10px}
  .rep-list{overflow:auto;flex:1;margin-bottom:12px}
  .rep-item{border-bottom:1px solid var(--line);padding:10px 0}
  .rep-item b{font-size:14px}
  .rep-item .rep-meta{font-size:12px;color:#6b7280;margin:4px 0 8px}
  .rep-item button{padding:5px 10px;font-size:12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;margin-right:6px;font-family:inherit}
  .rep-item button.danger{color:var(--lost);border-color:#fecaca;background:#fef2f2}
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .auth-card{background:#fff;border-radius:20px;padding:24px 20px;width:100%;max-width:390px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  .auth-card h1{font-size:21px;margin:0 0 4px;text-align:center}
  .auth-sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 18px}
  .tabs{display:flex;background:#f3f4f6;border-radius:12px;padding:4px;margin-bottom:16px}
  .tab{flex:1;padding:9px;border:0;background:none;border-radius:9px;font-size:14px;color:#6b7280;cursor:pointer;font-family:inherit}
  .tab.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .auth-card input{width:100%;padding:12px 13px;font-size:15px;border:1px solid var(--line);border-radius:12px;outline:none;margin-bottom:10px;font-family:inherit}
  .auth-card input:focus{border-color:var(--brand)}
  .nick-row{display:flex;gap:8px;margin-bottom:10px}
  .nick-row input{margin-bottom:0;background:#f9fafb;color:#374151}
  .nick-row button{flex:0 0 auto;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:13px;cursor:pointer;color:#374151;font-family:inherit}
  .auth-tip{font-size:12px;color:#9ca3af;text-align:center;margin:10px 0 0;line-height:1.7}
  .auth-tip b{color:#374151}
  .linkbtn{background:none;border:0;color:var(--brand);font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:0}
  .userbar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:9px 12px;margin:8px 0 14px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .userbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;color:#6b7280;cursor:pointer;font-family:inherit}
  .owner{color:#9ca3af}
  .sec-hint{font-size:11px;color:#9ca3af;margin:-6px 0 10px;line-height:1.5}
  .home-wrap{max-width:390px;margin:0 auto;padding:56px 20px 40px}
  .home-title{font-size:26px;text-align:center;margin:0 0 6px}
  .home-sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px}
  .home-stats{text-align:center;font-size:12px;color:var(--muted);margin-bottom:20px}
  .home-btn{display:flex;align-items:center;gap:14px;width:100%;padding:20px 18px;margin-bottom:14px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.04);cursor:pointer;text-align:left;font-family:inherit}
  .home-icon{font-size:30px}
  .home-text{flex:1}
  .home-text b{display:block;font-size:17px;margin-bottom:3px;color:var(--ink)}
  .home-text small{color:var(--muted);font-size:12px;line-height:1.4}
  .home-arrow{color:#cbd5e1;font-size:24px}
  .home-tip{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}
  .home-tip button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px;font-family:inherit;padding:0}
</style>
</head>
<body>

<div id="authView">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>🎒 校园服务</h1>
      <p class="auth-sub">登录后即可使用</p>
      <div class="tabs">
        <button class="tab on" data-tab="login" type="button">登录</button>
        <button class="tab" data-tab="reg" type="button">注册</button>
      </div>
      <form id="loginForm">
        <input name="account" placeholder="账号" autocapitalize="off" spellcheck="false">
        <input name="password" type="password" placeholder="密码">
        <button type="submit" class="primary" style="margin:6px 0 0">登录</button>
      </form>
      <p class="auth-tip" id="loginTip">忘记密码？<button type="button" class="linkbtn" id="forgotBtn">点这里重置</button></p>
      <form id="regForm" class="hide">
        <input name="account" placeholder="账号（3-20 位字母 / 数字 / 下划线）" autocapitalize="off" spellcheck="false">
        <div class="nick-row">
          <input name="nickname" readonly>
          <button type="button" id="reroll">换一个</button>
        </div>
        <input name="password" type="password" placeholder="密码（至少 6 位）">
        <input name="secq" maxlength="60" placeholder="密保问题（如：我小学班主任姓什么）">
        <input name="seca" maxlength="40" placeholder="密保答案">
        <p class="sec-hint">密保问题用来忘记密码时找回，答案不区分大小写，请记牢。</p>
        <button type="submit" class="primary" style="margin:6px 0 0">注册并登录</button>
        <p class="auth-tip">账号唯一，注册后别人不能再用；昵称随机生成。</p>
      </form>
    </div>
  </div>
</div>

<div id="homeView" class="hide">
  <div class="home-wrap">
    <h1 class="home-title">校园服务</h1>
    <p class="home-sub">你想做什么？</p>
    <div class="home-stats" id="homeStats">统计加载中…</div>

    <button class="home-btn" data-go="lost" type="button">
      <span class="home-icon">🎒</span>
      <span class="home-text">
        <b>失物招领</b>
        <small>丢了东西发布，捡到东西认领</small>
      </span>
      <span class="home-arrow">›</span>
    </button>

    <button class="home-btn" data-go="market" type="button">
      <span class="home-icon">🛒</span>
      <span class="home-text">
        <b>校园闲置</b>
        <small>发布和查看二手物品</small>
      </span>
      <span class="home-arrow">›</span>
    </button>

    <p class="home-tip">👋 <span id="homeNick">同学</span> · <button id="homeLogout" type="button">退出登录</button></p>
  </div>
</div>

<div id="appView" class="hide">
  <div class="wrap">
    <div class="head">
      <button id="backHome" class="backbtn" type="button">‹ 首页</button>
      <h1 id="moduleTitle">🎒 失物招领</h1>
      <span class="stat" id="stat"></span>
    </div>
    <div class="userbar">
      <span>👋 <b id="nickName">同学</b></span>
      <button id="logoutBtn" type="button">退出登录</button>
    </div>
    <div class="searchbox">
      <input id="q" type="text" placeholder="搜关键词：耳机 / 图书馆 / 校园卡" autocomplete="off">
      <span class="hint" id="hint"></span>
    </div>
    <div class="chips" id="typeChips">
      <button class="chip on" data-type="">全部</button>
      <button class="chip" data-type="lost">我丢了</button>
      <button class="chip" data-type="found">我捡到</button>
      <button class="chip" id="mineBtn">我的发布</button>
    </div>
    <div class="chips" id="catChips"></div>
    <button class="primary" id="toggleForm">＋ 发布信息</button>

    <form class="card form hide" id="form">
      <div class="field" id="typeWrap">
        <label>情况</label>
        <div class="chips" id="typePick">
          <button type="button" class="chip sm on" data-t="lost">我丢了，求归还</button>
          <button type="button" class="chip sm" data-t="found">我捡到了</button>
        </div>
      </div>
      <div class="field">
        <label>物品名称 *</label>
        <input name="title" maxlength="60" placeholder="如：白色 AirPods 耳机">
      </div>
      <div class="row">
        <div class="field">
          <label>分类</label>
          <select name="category" id="catSel"></select>
        </div>
        <div class="field">
          <label>地点</label>
          <input name="place" maxlength="60" placeholder="如：图书馆 3 楼">
        </div>
      </div>
      <div class="field" id="priceField">
        <label>价格（元）</label>
        <input name="price" type="number" min="0" step="0.01" placeholder="如：35">
      </div>
      <div class="field">
        <label>日期</label>
        <input name="time" type="date">
      </div>
      <div class="field">
        <label>详细描述</label>
        <textarea name="desc" maxlength="1000" placeholder="颜色、牌子、有什么特征…"></textarea>
      </div>
      <div id="claimFields" class="hide">
        <div class="field">
          <label>认领问题（只有失主答得出来）</label>
          <input name="q" maxlength="80" placeholder="如：耳机盒上贴了什么贴纸">
        </div>
        <div class="field">
          <label>正确答案</label>
          <input name="a" maxlength="40" placeholder="如：小黄鸭">
        </div>
      </div>
      <div class="field">
        <label>联系方式（验证通过后才会显示）</label>
        <input name="contact" maxlength="80" placeholder="微信 / 手机号 / QQ">
      </div>
      <div class="field">
        <label>照片（可选）</label>
        <input name="image" type="file" accept="image/*">
      </div>
      <div class="row">
        <button type="submit" class="primary" style="margin:0">发布</button>
        <button type="button" class="ghost" id="cancel">取消</button>
      </div>
    </form>

    <div id="list"></div>
    <p class="tip" id="count"></p>
    <p class="tip">
      <button id="adminBtn" type="button">管理入口</button>
      <button id="reportsBtn" type="button" class="hide">举报记录</button>
    </p>
  </div>
</div>

<div class="modal hide" id="modal">
  <div class="modal-box">
    <h4 id="mTitle">认领确认</h4>
    <p class="mSub" id="mSub"></p>
    <input type="text" id="mAnswer" placeholder="请输入答案">
    <input type="password" id="mAnswer2" placeholder="管理员密码" class="hide">
    <div id="mContact"></div>
    <div class="row">
      <button class="primary" id="mOk" style="margin:0">确认</button>
      <button class="ghost" id="mCancel">关闭</button>
    </div>
  </div>
</div>

<div class="modal hide" id="repModal">
  <div class="modal-box">
    <h4>举报记录</h4>
    <p class="mSub">这里是被举报过的信息，可以删除或忽略</p>
    <div class="rep-list" id="repList"></div>
    <button class="ghost" id="repClose">关闭</button>
  </div>
</div>

<div class="modal hide" id="forgotModal">
  <div class="modal-box">
    <h4>重置密码</h4>
    <p class="mSub" id="fgSub">输入账号，回答密保问题，就能设置新密码</p>
    <input type="text" id="fgAccount" placeholder="账号" autocapitalize="off" spellcheck="false">
    <div id="fgStep2" class="hide">
      <div class="contact-num" id="fgQuestion" style="font-size:14px;font-weight:500"></div>
      <input type="text" id="fgAnswer" placeholder="密保答案">
      <input type="password" id="fgNewPass" placeholder="新密码（至少 6 位）">
    </div>
    <div class="row">
      <button class="primary" id="fgOk" style="margin:0">下一步</button>
      <button class="ghost" id="fgCancel">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = '';

document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });

const CATEGORIES = ['证件卡类','电子产品','钥匙','书包钱包','衣物鞋帽','书籍资料','雨伞','水杯','眼镜','服装鞋包','数码配件','生活用品','其他'];
const OLD_DAYS = 30;

const RULES = [
  { cat:'电子产品', words:['手机','耳机','airpods','蓝牙','充电宝','充电器','电脑','笔记本','平板','ipad','u盘','数据线','鼠标','键盘','相机','手表','手环'] },
  { cat:'证件卡类', words:['身份证','学生证','校园卡','一卡通','银行卡','护照','驾驶证','驾照','饭卡','卡片','证件'] },
  { cat:'钥匙',     words:['钥匙','门禁','钥匙扣'] },
  { cat:'书包钱包', words:['书包','背包','手提袋','袋子','行李箱','钱包','卡包'] },
  { cat:'衣物鞋帽', words:['衣服','外套','卫衣','毛衣','帽子','围巾','鞋子','球鞋','运动鞋','袜子'] },
  { cat:'书籍资料', words:['书','课本','教材','笔记','资料','试卷','作业'] },
  { cat:'雨伞',     words:['伞','雨伞','遮阳伞'] },
  { cat:'水杯',     words:['水杯','杯子','保温杯','水瓶','水壶'] },
  { cat:'眼镜',     words:['眼镜','墨镜','隐形眼镜','镜框'] }
];

let currentUser = null;
let currentModule = 'lost';
let items = [];
let typeFilter = '';
let catFilter = '';
let onlyMine = false;
let pickType = 'lost';
let curTokens = [];
let curClaimId = null;
let modalMode = 'claim';
let adminAuth = null;
let editingId = null;
let fgStep = 1;
try { adminAuth = JSON.parse(sessionStorage.getItem('admin_auth') || 'null'); } catch (e) { adminAuth = null; }

const $ = (s) => document.querySelector(s);
const listEl = $('#list');
const qEl = $('#q');
const hintEl = $('#hint');
const form = $('#form');

async function api(path, opt = {}) {
  const headers = Object.assign({}, opt.headers || {});
  if (!(opt.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const token = localStorage.getItem('lf_token');
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, Object.assign({}, opt, { headers }));
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && token && path !== '/api/login' && path !== '/api/register') {
    localStorage.removeItem('lf_token');
    localStorage.removeItem('lf_user');
    currentUser = null;
    showAuth();
  }
  if (!res.ok) throw new Error(data.error || '网络错误');
  return data;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hl(s) {
  let out = esc(s);
  curTokens.forEach((t) => {
    const e = esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (!e) return;
    out = out.replace(new RegExp(e, 'gi'), (m) => '<mark>' + m + '</mark>');
  });
  return out;
}
function timeAgo(ts) {
  const d = Date.now() - (ts || 0);
  const m = Math.floor(d / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  const day = Math.floor(h / 24);
  if (day < 30) return day + ' 天前';
  return new Date(ts).toLocaleDateString('zh-CN');
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2600);
}
function guessCategory(text) {
  const t = (text || '').toLowerCase();
  for (const r of RULES) if (r.words.some((w) => t.includes(w))) return r.cat;
  return '';
}
function uid() {
  try { return crypto.randomUUID(); }
  catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
}
function compress(file, max = 640, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob((b) => b ? resolve(b) : reject(new Error('图片处理失败')), 'image/jpeg', quality);
    };
    img.onerror = () => reject(new Error('这张图片读不出来，换一张试试'));
    img.src = url;
  });
}
async function uploadImage(file) {
  const blob = await compress(file);
  const fd = new FormData();
  fd.append('file', blob, 'photo.jpg');
  return await api('/api/upload', { method: 'POST', body: fd });
}

function matchItem(it, tokens, guess) {
  if (onlyMine && !it.isMine) return false;
  if (typeFilter && it.type !== typeFilter) return false;
  if (catFilter && it.category !== catFilter) return false;
  if (!tokens.length) return true;
  const hay = [it.title, it.desc, it.place, it.category].join(' ').toLowerCase();
  if (tokens.every((t) => hay.includes(t))) return true;
  return !!(guess && it.category === guess);
}

function cardHtml(it) {
  const mine = it.isMine;
  const done = it.status === 'done';
  const isMarket = it.module === 'market';
  const old = !done && (Date.now() - it.createdAt) > OLD_DAYS * 86400000;
  const tag = isMarket
    ? '<span class="tag market">二手</span>'
    : (it.type === 'found' ? '<span class="tag found">拾获</span>' : '<span class="tag lost">丢失</span>');
  const price = isMarket && it.price ? '<span class="price">¥' + esc(it.price) + '</span>' : '';

  let btns = '';
  if (mine) {
    btns = '<button data-act="' + (done ? 'open' : 'done') + '" data-id="' + it.id + '">'
             + (done ? '重新上架' : (isMarket ? '✓ 已售出' : '✓ 已处理完')) + '</button>'
         + '<button data-act="edit" data-id="' + it.id + '">编辑</button>'
         + '<button class="danger" data-act="del" data-id="' + it.id + '">删除</button>';
  } else {
    btns = '<button class="main" data-act="claim" data-id="' + it.id + '">'
             + (isMarket ? '联系 TA' : (it.needsAnswer ? '我要认领' : '看联系方式')) + '</button>'
         + '<button class="tiny" data-act="report" data-id="' + it.id + '">举报</button>';
  }
  if (adminAuth) btns += '<button class="danger" data-act="adm_del" data-id="' + it.id + '">管理员删除</button>';

  return '<article class="card item ' + (done ? 'done' : '') + (old ? ' old' : '') + '" data-id="' + esc(it.id) + '">'
    + '<div class="top">' + tag + '<span class="cat">' + esc(it.category) + '</span>'
    + (done ? '<span class="tag ok">' + (isMarket ? '已售出' : '已完成') + '</span>' : '')
    + (old ? '<span class="tag old">超过 ' + OLD_DAYS + ' 天</span>' : '')
    + price
    + '</div><h3>' + hl(it.title) + '</h3>'
    + (it.image ? '<img src="' + esc(it.image) + '" alt="物品照片" loading="lazy" decoding="async">' : '')
    + (it.desc ? '<p class="desc">' + hl(it.desc) + '</p>' : '')
    + '<div class="meta"><span class="owner">👤 ' + esc(it.ownerName || '同学') + '</span>'
    + (it.place ? '<span>📍 ' + hl(it.place) + '</span>' : '')
    + (it.time ? '<span>🗓 ' + esc(it.time) + '</span>' : '')
    + '<span>🔒 联系方式需验证</span></div>'
    + '<div class="acts"><span class="time">' + timeAgo(it.createdAt) + '</span>' + btns + '</div></article>';
}

function render() {
  const q = (qEl.value || '').trim().toLowerCase();
  curTokens = q ? q.split(/\s+/).filter(Boolean) : [];
  const guess = curTokens.length ? guessCategory(q) : '';
  hintEl.textContent = (curTokens.length && guess) ? '已自动识别分类：' + guess : '';
  listEl.innerHTML = items.map(cardHtml).join('');
  applyFilter();
}

function applyFilter() {
  const q = (qEl.value || '').trim().toLowerCase();
  const tokens = q ? q.split(/\s+/).filter(Boolean) : [];
  const guess = tokens.length ? guessCategory(q) : '';
  let visible = 0;

  [...listEl.children].forEach((card) => {
    if (!card.classList.contains('item')) return;
    const it = items.find((x) => x.id === card.dataset.id);
    const ok = it ? matchItem(it, tokens, guess) : false;
    card.style.display = ok ? '' : 'none';
    if (ok) visible++;
  });

  let emptyEl = listEl.querySelector('.empty');
  if (!visible) {
    if (!emptyEl) {
      emptyEl = document.createElement('div');
      emptyEl.className = 'empty';
      emptyEl.textContent = items.length
        ? '没有匹配的信息，换个关键词试试 🙈'
        : (currentModule === 'market' ? '还没有人发布闲置，点上面「发布闲置」发第一条吧 👆' : '还没有人发布，点上面「发布信息」发第一条吧 👆');
      listEl.appendChild(emptyEl);
    }
    emptyEl.style.display = '';
  } else if (emptyEl) {
    emptyEl.style.display = 'none';
  }

  $('#stat').textContent = '在售 ' + items.filter((x) => x.status === 'open').length + ' 条';
  $('#count').textContent = onlyMine
    ? '我的发布 ' + visible + ' 条'
    : (tokens.length ? '找到 ' + visible + ' 条' : '共 ' + visible + ' 条信息');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!currentUser) return toast('请先登录');
  const btn = form.querySelector('button[type=submit]');
  const isEditing = !!editingId;
  btn.disabled = true;
  btn.textContent = isEditing ? '保存中…' : (currentModule === 'market' ? '发布中…' : '发布中…');
  try {
    const title = form.querySelector('[name=title]').value.trim();
    if (!title) throw new Error('请填写物品名称');
    const contact = form.querySelector('[name=contact]').value.trim();
    if (!contact) throw new Error('请留下联系方式，不然别人找到也没法还你');
    const price = currentModule === 'market' ? form.querySelector('[name=price]').value.trim() : '';
    if (currentModule === 'market' && !price) throw new Error('请填写价格');

    const old = isEditing ? items.find((x) => x.id === editingId) : null;
    let imageUrl = old ? old.image : '';
    let imageKey = '';
    const file = form.querySelector('[name=image]').files[0];
    if (file) {
      if (file.size > 10 * 1024 * 1024) throw new Error('图片超过 10MB，请换一张');
      const up = await uploadImage(file);
      imageUrl = up.url;
      imageKey = up.key;
    }

    const payload = {
      module: currentModule,
      title,
      type: currentModule === 'market' ? 'sell' : pickType,
      category: form.querySelector('[name=category]').value,
      place: form.querySelector('[name=place]').value.trim(),
      happenedOn: form.querySelector('[name=time]').value,
      description: form.querySelector('[name=desc]').value.trim(),
      contact, imageUrl, imageKey, price,
      claimQuestion: (currentModule === 'lost' && pickType === 'found') ? form.querySelector('[name=q]').value.trim() : '',
      claimAnswer: (currentModule === 'lost' && pickType === 'found') ? form.querySelector('[name=a]').value.trim() : ''
    };

    if (isEditing) {
      await api('/api/items/' + editingId, { method: 'PATCH', body: JSON.stringify(payload) });
      toast('已保存 ✅');
      resetForm();
      await load();
      return;
    }

    await api('/api/items', { method: 'POST', body: JSON.stringify(payload) });
    resetForm();
    toast(currentModule === 'market' ? '发布成功 🛒' : '发布成功 🎉');
    await load();
  } catch (err) { toast(err.message || '操作失败'); }
  finally { btn.disabled = false; btn.textContent = editingId ? '保存修改' : (currentModule === 'market' ? '发布闲置' : '发布'); }
});

listEl.addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  const act = b.dataset.act;
  if (act === 'claim') return openClaim(id);
  if (act === 'edit') return openEdit(id);

  if (act === 'report') {
    if (!confirm('举报这条信息？如果是误报请别点。累计 3 人举报会自动下架。')) return;
    b.disabled = true;
    try {
      await api('/api/items/' + id + '/report', { method: 'POST', body: '{}' });
      toast('已举报，管理员会处理');
    } catch (err) { toast(err.message || '举报失败'); }
    finally { b.disabled = false; }
    return;
  }

  if (act === 'adm_del') {
    if (!confirm('管理员操作：删除这条信息？')) return;
    b.disabled = true;
    try {
      await api('/api/admin/delete', {
        method: 'POST',
        body: JSON.stringify({ id, account: adminAuth.account, password: adminAuth.password })
      });
      toast('已删除');
      await load();
    } catch (err) { toast(err.message || '删除失败'); }
    finally { b.disabled = false; }
    return;
  }

  if (act === 'del' && !confirm('确定要删除这条信息吗？删了就找不回来了。')) return;
  b.disabled = true;
  try {
    if (act === 'done' || act === 'open') {
      await api('/api/items/' + id + '/status', {
        method: 'POST',
        body: JSON.stringify({ status: act === 'done' ? 'done' : 'open' })
      });
      toast(act === 'done' ? (currentModule === 'market' ? '已标记售出 ✅' : '已标记完成 ✅') : '已重新上架');
      await load();
    }
    if (act === 'del') {
      await api('/api/items/' + id, { method: 'DELETE' });
      toast('已删除');
      await load();
    }
  } catch (err) { toast(err.message || '操作失败'); }
  finally { b.disabled = false; }
});

function openClaim(id) {
  const it = items.find((x) => x.id === id);
  if (!it) return;
  if (it.isMine) return toast('这是你自己发的');
  curClaimId = id;
  modalMode = 'claim';
  const isMarket = it.module === 'market';
  $('#mTitle').textContent = isMarket ? '联系卖家' : (it.type === 'found' ? '认领这件物品' : '联系发布者');
  $('#mSub').textContent = it.needsAnswer
    ? '请回答发布者设的问题：\n' + it.claimQuestion
    : (isMarket ? '确认后显示卖家联系方式' : '提示：先确认好物品特征，避免误认。');
  const ans = $('#mAnswer');
  ans.value = ''; ans.type = 'text'; ans.placeholder = '请输入答案';
  ans.classList.toggle('hide', !it.needsAnswer);
  $('#mAnswer2').classList.add('hide'); $('#mAnswer2').value = '';
  $('#mContact').innerHTML = '';
  $('#mOk').classList.remove('hide'); $('#mOk').textContent = '确认';
  $('#modal').classList.remove('hide');
  if (it.needsAnswer) setTimeout(() => ans.focus(), 100);
}

function openAdmin() {
  if (adminAuth) {
    if (confirm('退出管理模式？')) { clearAdmin(); toast('已退出管理模式'); }
    return;
  }
  modalMode = 'admin';
  $('#mTitle').textContent = '管理员登录';
  $('#mSub').textContent = '输入管理员账号和密码';
  const a1 = $('#mAnswer'); const a2 = $('#mAnswer2');
  a1.value = ''; a1.type = 'text'; a1.placeholder = '管理员账号'; a1.classList.remove('hide');
  a2.value = ''; a2.classList.remove('hide');
  $('#mContact').innerHTML = '';
  $('#mOk').classList.remove('hide'); $('#mOk').textContent = '进入';
  $('#modal').classList.remove('hide');
  setTimeout(() => a1.focus(), 100);
}
$('#adminBtn').addEventListener('click', openAdmin);
$('#mCancel').addEventListener('click', () => $('#modal').classList.add('hide'));
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') $('#modal').classList.add('hide'); });

$('#mOk').addEventListener('click', async () => {
  const b = $('#mOk');
  if (modalMode === 'admin') {
    b.disabled = true;
    try {
      const account = $('#mAnswer').value.trim();
      const password = $('#mAnswer2').value;
      if (!account || !password) throw new Error('请填账号和密码');
      const r = await api('/api/admin/check', { method: 'POST', body: JSON.stringify({ account, password }) });
      if (!r.ok) throw new Error('管理员账号或密码不对');
      adminAuth = { account, password };
      sessionStorage.setItem('admin_auth', JSON.stringify(adminAuth));
      document.body.classList.add('admin-on');
      $('#adminBtn').textContent = '管理员模式（点此退出）';
      $('#reportsBtn').classList.remove('hide');
      $('#modal').classList.add('hide');
      toast('已进入管理模式');
      render();
    } catch (err) { toast(err.message || '验证失败'); }
    finally { b.disabled = false; }
    return;
  }

  if (!curClaimId) return;
  b.disabled = true; b.textContent = '验证中…';
  try {
    const r = await api('/api/items/' + curClaimId + '/claim', {
      method: 'POST',
      body: JSON.stringify({ answer: $('#mAnswer').value })
    });
    if (!r.ok) throw new Error(r.msg || '验证没通过');
    $('#mAnswer').classList.add('hide');
    b.classList.add('hide');
    $('#mSub').textContent = '验证通过 ✅ 这是对方的联系方式';
    const c = String(r.contact || '');
    $('#mContact').innerHTML = '<div class="contact-num">' + esc(c || '对方没留联系方式') + '</div>'
      + (c ? '<button class="ghost" id="copyBtn" style="margin-bottom:12px">复制</button>' : '');
    if (c) {
      $('#copyBtn').addEventListener('click', () => {
        const done = () => toast('已复制');
        if (navigator.clipboard) navigator.clipboard.writeText(c).then(done, done); else done();
      });
    }
  } catch (err) { toast(err.message || '验证失败'); }
  finally { b.disabled = false; b.textContent = '确认'; }
});

async function openReports() {
  if (!adminAuth) return toast('请先进入管理模式');
  $('#repList').innerHTML = '<div class="empty" style="padding:20px">加载中…</div>';
  $('#repModal').classList.remove('hide');
  try {
    const data = await api('/api/admin/reports', {
      method: 'POST',
      body: JSON.stringify({ account: adminAuth.account, password: adminAuth.password })
    });
    if (!data.length) { $('#repList').innerHTML = '<div class="empty" style="padding:20px">还没有人举报 ✅</div>'; return; }
    $('#repList').innerHTML = data.map((r) => (
      '<div class="rep-item"><b>' + esc(r.title) + '</b>'
      + '<div class="rep-meta">' + (r.module === 'market' ? '🛒 二手' : '🎒 失物') + ' · 👤 ' + esc(r.owner_name || '同学') + ' · 被举报 ' + (r.report_count || 0) + ' 次 · 状态：'
      + (r.status === 'hidden' ? '已自动隐藏' : r.status === 'done' ? '已完成' : '显示中') + '</div>'
      + '<button class="danger" data-rep-del="' + r.id + '">删除这条</button>'
      + '<button data-rep-clear="' + r.id + '">忽略举报</button></div>'
    )).join('');
  } catch (err) { $('#repList').innerHTML = '<div class="empty" style="padding:20px">' + esc(err.message) + '</div>'; }
}
$('#reportsBtn').addEventListener('click', openReports);
$('#repClose').addEventListener('click', () => $('#repModal').classList.add('hide'));
$('#repModal').addEventListener('click', (e) => { if (e.target.id === 'repModal') $('#repModal').classList.add('hide'); });

$('#repList').addEventListener('click', async (e) => {
  const del = e.target.closest('button[data-rep-del]');
  const clr = e.target.closest('button[data-rep-clear]');
  if (!del && !clr) return;
  const id = (del || clr).dataset.repDel || (del || clr).dataset.repClear;
  try {
    if (del) {
      if (!confirm('删除这条被举报的信息？')) return;
      await api('/api/admin/delete', {
        method: 'POST',
        body: JSON.stringify({ id, account: adminAuth.account, password: adminAuth.password })
      });
      toast('已删除');
    } else {
      await api('/api/admin/clear-reports', {
        method: 'POST',
        body: JSON.stringify({ id, account: adminAuth.account, password: adminAuth.password })
      });
      toast('已忽略举报');
    }
    await load(); openReports();
  } catch (err) { toast(err.message || '操作失败'); }
});

if (adminAuth) {
  document.body.classList.add('admin-on');
  $('#adminBtn').textContent = '管理员模式（点此退出）';
  $('#reportsBtn').classList.remove('hide');
}
renderCats();
</script>
</body>
</html>
